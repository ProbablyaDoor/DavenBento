<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="style.css" />
    <title>Food of Daven</title>
  </head>

    <style>
        *, *::after, *::before {
            box-sizing: border-box;
            padding: 0;
            margin: 0;
        }
        button {
            font: inherit;
            border: none;
            cursor: pointer;
        }
            
        .container {
            min-height: 100vh;
            display: grid;
            gap: 2rem;
            place-items: center;
            align-content: center;
        }

        .container--flex {
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
            place-items: center;
            justify-content: center;
        }

        .btn {
            font-size: 1.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: .5em;
            background-color: hsl(45, 87%, 52%);
            color: hsl(0, 40%, 15%);
            text-decoration: none;
            padding: .4em 1.4em;
            border-radius: .2em;
            box-shadow:
                .05em .1em .9em hsl(20 100% 50% / .3),
                0 0 0 -.1em hsl(20, 100%, 36%),
                0 0 0 -.2em hsl(20, 100%, 27%)
        }

        .btn:where(:active, :hover){
            background-color: hsl(66, 100%, 68%);
        }
    </style>
  <body>
    <div class="container">
        <h1>Our Food!11!</h1>
        <div class="container--flex">
            <img src = https://media.discordapp.net/attachments/1199156459469013092/1557661048985751563/pie_cool.png?ex=6acfdca6&is=6ace8b26&hm=cffc70173b2187d03f7048aad5c39585cac85c45abf9ed039f6b5b6697211775&=&format=webp&quality=lossless&width=384&height=384
            />
            <img src = https://media.discordapp.net/attachments/1199156459469013092/1557661296843825152/222332-how-to-cook-a-turkey-ddmfs-1x1-1-7560311b7ccc4efc8ef0b065f346d966.jpg?ex=6acfdce1&is=6ace8b61&hm=9318fc005bdcacc1873cd97efdcacd5d61e55c3d47fbf43824b88fb33ac91038&=&format=webp&width=384&height=384
            />
            <img src = https://media.discordapp.net/attachments/1199156459469013092/1557661638264492052/images_3.jpg?ex=6acfdd32&is=6ace8bb2&hm=703565cb9a4e7acd2339305c1e7050f624485f789d1c74e5892f80dd976c43dd&=&format=webp&width=384&height=384
            />
        </div>
        <p>*We do not guarantee your food will actually look like this</p>
        <div class="container--flex">
            <button class="btn" onclick="window.location.href='index.html'">Back</button>
        </div>
    </div>
  </body>
</html>
