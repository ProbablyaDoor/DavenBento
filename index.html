<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="style.css" />
    <title>Daven Sushi Master 6000</title>
  </head>

    <style>
        *, *::after, *::before {
            box-sizing: border-box;
            padding: 0;
            margin: 0;
        }
        button {
            font: inherit;
            border: none;
            cursor: pointer;
        }
            
        .container {
            min-height: 100vh;
            display: grid;
            gap: 2rem;
            place-items: center;
            align-content: center;
        }

        .container--flex {
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
            place-items: center;
            justify-content: center;
        }

        .btn {
            font-size: 1.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: .5em;
            background-color: hsl(45, 87%, 52%);
            color: hsl(0, 40%, 15%);
            text-decoration: none;
            padding: .4em 1.4em;
            border-radius: .2em;
            box-shadow:
                .05em .1em .9em hsl(20 100% 50% / .3),
                0 0 0 -.1em hsl(20, 100%, 36%),
                0 0 0 -.2em hsl(20, 100%, 27%)
        }

        .btn:where(:active, :hover){
            background-color: hsl(66, 100%, 68%);
        }
    </style>
  <body>
    <div class="container">
        <img src = https://cdn.discordapp.com/attachments/1199156459469013092/1557638295909830718/chef_daven2.png?ex=6ac88735&is=6ac735b5&hm=5c228b9160dfe9a7d4131c440f5c5963a55b9cca2df52271f55fe3259624a5df&
        />
        <h1>Daven Sushi Master 6000</h1>
        <div class="container--flex">
            <button class="btn" onclick="window.location.href='food.html'">Food</button>
            <button class="btn" onclick="window.location.href='staff.html'">Staff</button>
            <button class="btn" onclick="window.location.href='secret.html'">Secret Recipe</button>
        </div>
    </div>
  </body>
</html>
