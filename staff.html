<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="style.css" />
    <title>Staff of Daven</title>
  </head>

    <style>
        *, *::after, *::before {
            box-sizing: border-box;
            padding: 0;
            margin: 0;
        }
        button {
            font: inherit;
            border: none;
            cursor: pointer;
        }
            
        .container {
            min-height: 100vh;
            display: grid;
            gap: 2rem;
            place-items: center;
            align-content: center;
        }

        .container--flex {
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
            place-items: center;
            justify-content: center;
        }

        .btn {
            font-size: 1.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: .5em;
            background-color: hsl(45, 87%, 52%);
            color: hsl(0, 40%, 15%);
            text-decoration: none;
            padding: .4em 1.4em;
            border-radius: .2em;
            box-shadow:
                .05em .1em .9em hsl(20 100% 50% / .3),
                0 0 0 -.1em hsl(20, 100%, 36%),
                0 0 0 -.2em hsl(20, 100%, 27%)
        }

        .btn:where(:active, :hover){
            background-color: hsl(66, 100%, 68%);
        }
    </style>
  <body>
    <div class="container">
        <h1>Meet the Team!</h1>
        <div class="container--flex">
            <div class="staff_member">
            <img src = https://media.discordapp.net/attachments/1199156459469013092/1557665145008951306/daveens.PNG?ex=6acfe076&is=6ace8ef6&hm=8be8bfa6270e139c24a740094900724d1e61335f76901144a4abdd0e233e158e&=&format=webp&quality=lossless&width=384&height=384>
            <h1>Daven (Head Chef)</h1>
            </div>
            <div class="staff_member">
            <img src = https://media.discordapp.net/attachments/1199156459469013092/1557665102336106587/orpheepus.PNG?ex=6acfe06c&is=6ace8eec&hm=1358a09a7f0c4429bf443975c5da291d9c265b08164cfdb236b2a121a652507c&=&format=webp&quality=lossless&width=384&height=384>
            <h1>Orpheus (Chef)</h1>
            </div>
            <div class="staff_member">
            <img src = https://media.discordapp.net/attachments/1199156459469013092/1557665101807358032/pybentoman.png?ex=6acfe06c&is=6ace8eec&hm=c0924c138a89cafb6aa19421e76bdd26c822d07efb3a336b75ce46a565befd4c&=&format=webp&quality=lossless&width=384&height=384>
            <h1>Py (Chef)</h1>
            </div>

        </div>
        <div class="container--flex">
            <button class="btn" onclick="window.location.href='index.html'">Back</button>
        </div>
    </div>
  </body>
</html>
